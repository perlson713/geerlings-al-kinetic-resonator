[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geerlings-resonator"
version = "0.1.0"
description = "Parametric layout, PEC eigenmode, and Al kinetic-inductance workflow for Geerlings et al. Fig. 1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Codex implementation" }]
dependencies = [
  "gdsfactory>=9.46,<10",
]

[project.optional-dependencies]
mesh = [
  "gds2palace>=0.2,<0.3",
  "gmsh>=4.13",
]
cad = [
  "build123d>=0.9,<1",
]
gui = [
  "setupEM>=0.1.22,<0.2",
]
analysis = [
  "matplotlib>=3.8",
  "numpy>=2,<3",
  "scipy>=1.16,<2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
]
all = [
  "gds2palace>=0.2,<0.3",
  "gmsh>=4.13",
  "build123d>=0.9,<1",
  "setupEM>=0.1.22,<0.2",
  "matplotlib>=3.8",
  "numpy>=2,<3",
  "scipy>=1.16,<2",
]

[project.scripts]
geerlings-em = "geerlings_resonator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geerlings_resonator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires gdsfactory/gmsh/gds2palace or Palace",
]

[tool.coverage.run]
source = ["geerlings_resonator"]
